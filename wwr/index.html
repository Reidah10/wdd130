<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="This is the home page. This is where visitors can sign up for the newsletter and get some basic information about rafting.">
    <meta name="author" content="Reid Howard">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting_logo.jpg" alt="Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="index-hero">
            <h1>Raging Rapids Rafting</h1>
            <img src="images/index-hero.jpg" alt="Large Rafting Image with Rocks">
        </section>
        <div class="index-newsletter">
            <form>
                <h2>Newsletter</h2>
                <p>Keep up with our latest adventures!</p>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">
                <button type="submit">
                    Sign me up!
                </button>
            </form>
        </div>
        <div class="index-grid">
            <figure>
                <h2>Adventure</h2>
                <img src="images/mountain-view.jpg" alt="Image of the mountains from the river">
                <figcaption>Whether you prefer a nice cruise down the river or the thrill of the
                    rapids,
                    Raging Rapids Rafting has what's right for you.</figcaption>
            </figure>
            <figure>
                <h2>Memorable Experiences</h2>
                <img src="images/yellow-raft.jpg" alt="Rafting group on a yellow raft">
                <figcaption>Our expert guides make every tour a cherished memory! Check out our
                    available tours and book your next adventure today!</figcaption>
            </figure>
        </div>

        <a href="trips.html" class="index-cta">Check out our tours!</a>

    </main>
    <footer>
        <p>&copy; 2026 | Raging Rapids Rafting | Reid Howard</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Social Media Icon" width="35">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Social Media Icon" width="35">
            </a>
            <a href="https://x.com">
                <img src="images/x_logo.svg" alt="X Social Media Icon" width="35">
            </a>
        </nav>
    </footer>
</body>

</html>
