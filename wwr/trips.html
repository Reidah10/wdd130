<!DOCTYPE html>

<head>

      content="This is the trips page. It gives detailed information about the different trips people can book.">

<body>
    <header>
        <img src="images/rafting_logo.jpg" alt="Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="trips">
            <h1>Find Your Next Adventure!</h1>

            <a href="contact.html" class="contact-us-cta">Contact Us</a>

            <figure>
                <h1>Colorado Outing</h1>
                <img src="images/colorado.jpg" alt="Colorado Trip Image">
                <figcaption>Just outside the Denver area, take in the views while tackling some
                    moderate waves! A perfect ride for beginners and those just testing out the
                    waters.</figcaption>
            </figure>
            <figure>
                <h1>Idaho Experience</h1>
                <img src="images/idaho.jpg" alt="Idaho Trip Image">
                <figcaption>For those who are looking for a challenge, come float the beautiful
                    Salmon River and test your metal against some
                    ambitious rapids!</figcaption>
            </figure>
            <figure>
                <h1>Wyoming Adventure</h1>
                <img src="images/wyoming.jpg" alt="Wyoming Trip Image">
                <figcaption>Perfect for you hardcore adrenaline seekers! Experience the might of the
                    Wind River Canyon with our expert guides!</figcaption>
            </figure>
        </div>
        <div class="trips-table">
            <h2>Available Tours</h2>
            <table>
                <tr>
                    <th>Tour</th>
                    <th>Duration</th>
                    <th>Difficulty</th>
                    <th>Price</th>
                </tr>
                <tr>
                    <td>Colorado</td>
                    <td>3 Hours</td>
                    <td>Easy</td>
                    <td>$75</td>
                </tr>
                <tr>
                    <td>Idaho</td>
                    <td>5 Hours</td>
                    <td>Medium</td>
                    <td>$100</td>
                </tr>
                <tr>
                    <td>Wyoming</td>
                    <td>6.5 Hours</td>
                    <td>Hard</td>
                    <td>$150</td>
                </tr>
            </table>
        </div>
        <a href="contact.html" class="trip-cta">Book Your Trip Now!</a>
